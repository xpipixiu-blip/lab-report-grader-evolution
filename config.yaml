# ============================================================
# 实验报告 AI 批改系统 — 配置文件
# 你可以修改评分维度和权重来适配不同的实验课
# ============================================================

# ---- API 设置 ----
api:
  base_url: ""
  # 默认模型（会在启动时尝试自动拉取模型列表）
  default_model: "qwen-plus"
  # 如果自动拉取模型列表失败，使用以下备选列表
  fallback_models:
    - "qwen-plus"
    - "qwen-max"
    - "qwen-turbo"
    - "glm-4"
    - "glm-4-flash"
    - "glm-4-plus"
    - "deepseek-chat"
    - "deepseek-reasoner"
  # API 调用参数
  temperature: 0.3
  max_tokens: 4096
  timeout: 120  # 秒

# ---- 预习报告评分标准 ----
preview_rubric:
  report_type: "预习报告"
  total_score: 100
  dimensions:
    - key: "principle"
      name: "实验原理理解"
      weight: 0.40
      max_score: 40.0
      description: |
        评估学生对实验所涉及化学原理的理解程度：
        - 是否用自己的话简述实验原理，而非照抄教材
        - 关键化学反应方程式是否书写正确、配平
        - 是否理解各试剂的作用
    - key: "procedure"
      name: "实验步骤完整性"
      weight: 0.25
      max_score: 25.0
      description: |
        评估实验步骤的准备质量：
        - 步骤是否完整，关键操作是否明确标注
        - 是否用流程图或分点方式呈现（鼓励流程图）
        - 是否标注了关键药品用量和仪器
    - key: "safety"
      name: "安全与注意事项"
      weight: 0.10
      max_score: 10.0
      description: |
        评估学生对实验安全的认识：
        - 是否识别了关键安全风险（如强酸/强碱/加热/有毒物质）
        - 是否列出个人防护措施
        - 是否标注了废弃物处理方法
    - key: "prediction"
      name: "预期现象与数据记录"
      weight: 0.15
      max_score: 15.0
      description: |
        评估学生对实验结果的预判：
        - 是否对关键步骤的预期现象有合理预判（颜色变化、沉淀生成等）
        - 是否设计了数据记录表格（即使空白）
        - 是否标注了关键数据记录节点
    - key: "format"
      name: "格式与规范"
      weight: 0.10
      max_score: 10.0
      description: |
        评估报告的规范程度：
        - 排版是否整洁、层次清晰
        - 化学式、单位符号是否书写规范
        - 是否有明显的错别字或格式错误

# ---- 实验报告评分标准 ----
lab_rubric:
  report_type: "实验报告"
  total_score: 100
  dimensions:
    - key: "data"
      name: "实验数据完整性与真实性"
      weight: 0.25
      max_score: 25.0
      description: |
        评估实验数据的质量：
        - 数据记录是否完整（无遗漏项）
        - 数据是否合理可信（无明显的编造痕迹）
        - 有效数字的保留是否正确
        - 是否记录了平行实验数据
        - 数据记录是否清晰、有条理
    - key: "calculation"
      name: "计算过程与结果正确性"
      weight: 0.20
      max_score: 20.0
      description: |
        评估数据处理能力：
        - 计算公式是否书写正确
        - 计算过程是否完整（有代入、有步骤）
        - 最终结果是否正确或落在合理范围内
        - 是否对计算结果进行了必要的处理（如平均值、标准偏差）
    - key: "error_analysis"
      name: "误差分析与讨论"
      weight: 0.15
      max_score: 15.0
      description: |
        评估反思和批判性思维：
        - 是否计算了误差（如相对误差、标准偏差）
        - 是否分析了误差的可能来源（系统误差 vs 偶然误差）
        - 是否提出了切实可行的改进建议
        - 对异常数据是否有合理的分析和解释
    - key: "observation"
      name: "实验现象记录与分析"
      weight: 0.20
      max_score: 20.0
      description: |
        评估观察和化学分析能力：
        - 是否准确、详细地记录了各步骤的实验现象
        - 是否能运用化学原理解释观察到的现象
        - 对意料之外的现象是否有思考和探究
        - 现象描述是否使用准确的化学术语
    - key: "conclusion"
      name: "结论与思考题"
      weight: 0.10
      max_score: 10.0
      description: |
        评估总结能力和深度：
        - 结论是否明确、简洁
        - 是否回应了实验目的
        - 思考题是否认真作答（如有）
        - 是否有自己的思考和延伸
    - key: "format"
      name: "格式、图表与参考文献"
      weight: 0.10
      max_score: 10.0
      description: |
        评估学术规范：
        - 报告结构是否完整（目的-原理-步骤-数据-讨论-结论）
        - 图表是否清晰美观（有标题、有编号、坐标轴有标注）
        - 参考文献格式是否规范（如有引用）
        - 是否有明显抄袭痕迹
